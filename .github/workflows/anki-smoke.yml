name: anki-smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install anki
        run: pip install anki

      - name: AnkiWeb login smoke test
        env:
          ANKIWEB_USER: ${{ secrets.ANKIWEB_USER }}
          ANKIWEB_PASS: ${{ secrets.ANKIWEB_PASS }}
        run: python scripts/anki_smoke.py
