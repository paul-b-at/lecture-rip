name: lecture-rip

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      course_filter:
        description: 'Only process courses matching (regex)'
        required: false
        default: ''
      force_rerip:
        description: 'Re-rip lectures already at Done (resets their Status to Discovered first)'
        type: boolean
        default: false

concurrency:
  group: lecture-rip
  cancel-in-progress: false

jobs:
  rip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Restore pipeline cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: lecture-rip-state-v1

      - name: Run pipeline
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          LECTURES_DS_ID: ${{ secrets.LECTURES_DS_ID }}
          SUBJECTS_DS_ID: ${{ secrets.SUBJECTS_DS_ID }}
          # Optional: Lectures DB column titles (exact match; omit to use defaults in src/notion.ts)
          NOTION_LECTURES_NAME: ${{ secrets.NOTION_LECTURES_NAME }}
          NOTION_LECTURES_LECTURE_ID: ${{ secrets.NOTION_LECTURES_LECTURE_ID }}
          NOTION_LECTURES_COURSE_SUBJECT: ${{ secrets.NOTION_LECTURES_COURSE_SUBJECT }}
          NOTION_LECTURES_SUBJECT_KIND: ${{ secrets.NOTION_LECTURES_SUBJECT_KIND }}
          NOTION_LECTURES_MEDIA_URL: ${{ secrets.NOTION_LECTURES_MEDIA_URL }}
          NOTION_LECTURES_STATUS: ${{ secrets.NOTION_LECTURES_STATUS }}
          NOTION_LECTURES_SKIP_REASON: ${{ secrets.NOTION_LECTURES_SKIP_REASON }}
          # Optional: Subjects DB column titles
          NOTION_SUBJECTS_MEDIA_COURSE_ID: ${{ secrets.NOTION_SUBJECTS_MEDIA_COURSE_ID }}
          NOTION_SUBJECTS_MEDIA_SERIES_ID: ${{ secrets.NOTION_SUBJECTS_MEDIA_SERIES_ID }}
          NOTION_SUBJECTS_GLOSSARY: ${{ secrets.NOTION_SUBJECTS_GLOSSARY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_DAILY_AUDIO_SECONDS: ${{ secrets.GROQ_DAILY_AUDIO_SECONDS }}
          GROQ_HOURLY_AUDIO_SECONDS: ${{ secrets.GROQ_HOURLY_AUDIO_SECONDS }}
          GROQ_DAILY_REQUESTS: ${{ secrets.GROQ_DAILY_REQUESTS }}
          GROQ_INTER_CHUNK_MS: ${{ secrets.GROQ_INTER_CHUNK_MS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_DAILY_REQUESTS: ${{ secrets.GEMINI_DAILY_REQUESTS }}
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
          MEDIA_SEMESTER: ${{ secrets.MEDIA_SEMESTER }}
          MEDIA_SEMESTER_TZ: ${{ secrets.MEDIA_SEMESTER_TZ }}
          MEDIA_RESOLVE_LOOSE_LU: ${{ secrets.MEDIA_RESOLVE_LOOSE_LU }}
          MEDIA_SESSION_COOKIE: ${{ secrets.MEDIA_SESSION_COOKIE }}
          COURSE_FILTER: ${{ inputs.course_filter }}
          FORCE_RERIP: ${{ inputs.force_rerip }}
        run: bun run src/index.ts

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: |
            logs/*.log
            logs/*.json
          retention-days: 14

      - name: Notify on failure
        if: failure()
        run: |
          curl -d "lecture-rip failed: run ${{ github.run_id }}" \
            https://ntfy.sh/${{ secrets.NTFY_TOPIC }}
